services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: {context: ./apps/api, target: runtime}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on: {db: {condition: service_healthy}}
    networks: [private]
  api:
    build: {context: ./apps/api, target: runtime}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-production}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
      CSRF_SECRET: ${CSRF_SECRET:?set CSRF_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # API is only reachable through the web proxy on the private network.
      TRUST_PROXY: "1"
    depends_on: {migrate: {condition: service_completed_successfully}}
    networks: [private]
    healthcheck: {test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""], interval: 10s, timeout: 5s, retries: 10}
  web:
    build: {context: ./apps/web, target: runtime}
    restart: unless-stopped
    environment: {API_INTERNAL_URL: http://api:4000, NODE_ENV: production, PORT: 3000, HOSTNAME: 0.0.0.0}
    depends_on: {api: {condition: service_healthy}}
    ports: ["3000:3000"]
    networks: [private]
    healthcheck: {test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""], interval: 10s, timeout: 5s, retries: 10}
  demo-seed:
    profiles: [demo]
    build: {context: ./apps/api, target: runtime}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: development
      SEED_DEMO: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    command: ["npx", "tsx", "prisma/seed.ts"]
    depends_on: {migrate: {condition: service_completed_successfully}}
    networks: [private]
networks: {private: {driver: bridge}}
volumes: {postgres_data: {}}
